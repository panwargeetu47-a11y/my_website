<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        header {
            background: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 30px;
        }

        nav {
            background: #333;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 20px;
            text-decoration: none;
            font-size: 18px;
        }

        nav a:hover {
            color: #4CAF50;
        }

        .content {
            padding: 30px;
            max-width: 900px;
            margin: auto;
            background: white;
            margin-top: 20px;
            border-radius: 10px;
        }

        h2 {
            color: #333;
        }

        footer {
            text-align: center;
            background: #333;
            color: white;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        Welcome to My Website 
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
    </nav>

    <div class="content">
        <h2>Hello, I'm Gayatri!</h2>
        <p>
            This is my first beautiful HTML webpage.
            I am learning web development and GitHub.
        </p>

        <p>
            This page has a header, navigation bar, content section, and footer.
        </p>
    </div>

    <footer>
        2025 My Website | Designed by Me 
    </footer>

</body>
</html>
